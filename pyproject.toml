[build-system]
requires = ["hatchling>=1.27,<2", "editables>=0.5,<0.6"]
build-backend = "hatchling.build"

[project]
name = "paper-library"
version = "0.1.0"
description = "Local paper ingestion, translation, and reading workspace"
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.1.3,<4",
  "waitress>=3.0.2,<4",
  "markdown-it-py>=4.2.0,<5",
  "mdit-py-plugins>=0.6.1,<1",
  "bleach>=6.4.0,<7",
  "latex2mathml>=3.81.0,<4",
  "httpx>=0.28,<1",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "beautifulsoup4>=4.14.3,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/paper_library"]

[tool.hatch.build.targets.sdist]
include = ["src/paper_library", "scripts", "tests", "examples", "README.md", "pyproject.toml", "requirements.lock", ".env.example", "docs/maintenance"]

[tool.pytest.ini_options]
testpaths = ["tests"]
